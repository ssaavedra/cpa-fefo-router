# Example plugins section for CLIProxyAPI's config.yaml.
# The library must be named fefo-router.so (.dylib/.dll) in plugins.dir.
plugins:
  enabled: true
  dir: "plugins"
  configs:
    fefo-router:
      enabled: true
      priority: 10              # only the highest-priority scheduler plugin is used
      mode: active              # active | observe (restart CPA after changing)
      state_file: /CLIProxyAPI/config/fefo-router/state.json

      # Lend an account's quota to other buckets while
      #   remaining > spare_factor × (expected use by its home clients until it resets)
      # Quota is measured in API-equivalent dollars (every request priced at
      # its model's API rates).
      spare_factor: 1.5
      min_spare: 0.03           # spare needed to start lending, share of the account's week
      # Share of its week an account keeps for its home clients, by time left
      # until its weekly reset (linear in between; nearest point outside).
      # Here: lend only above 70% left with a full week to go, down to 1% left
      # with 8h to go. A single number keeps the same share all week. Omit to
      # keep no reserve.
      # lend_reserve: {7d: 0.7, 8h: 0.01}
      lend_min_short: 0.3       # stop lending while the 5h window has less than this left (0: off)
      min_history: 6h           # demand history needed before anything is lent
      min_remaining: 0.01       # a window with less left blocks the account
      session_ttl: 1h           # how long a (key, session) stays pinned to an account
      probe_interval: 5m        # accounts without quota data get one request this often
      stale_after: 30m          # limit flags without a reset time expire after this
      allow_extra_usage: false  # never serve from paid overage (also keeps Fable off plans without an allowance)
      log_decisions: true
      # Default units of the text status and the UI: usd | tokens |
      # pct_relative (share of the thing's own week) | pct_absolute (share of
      # the provider's largest account's week).
      display_units: usd

      # Each Claude account's usage report (Fable allowance, extra usage) is
      # fetched through CPA this often; 0 disables.
      usage_poll_interval: 5m
      scoped_families: [fable]  # families with their own allowance, kept off plans without one

      # Prices: config overrides > daily models.dev sync > built-in snapshot.
      pricing:
        sync: true
        sync_interval: 24h
        url: https://models.dev/api.json
      # prices:
      #   claude-fable-6: {input: 10, output: 50, cache_read: 1, cache_write: 12.5}   # USD per 1M tokens

      # Buckets: named groups of accounts (e-mail, auth file name or auth ID).
      buckets:
        work:     [me@work.example]
        side:     [me@side.example]
        personal: [me@personal.example]

      # Most of a bucket's week (its accounts' capacity summed, per provider)
      # that other buckets' clients may use per week, whatever its spare.
      # Target: a bucket (its clients) or any (every borrower). Share: a
      # number, or a curve by time left until the reset as in lend_reserve.
      # lend_limits:
      #   work:
      #     any: 0.2
      #     personal: {7d: 0.02, 8h: 0.4}

      # Weekly capacity in dollars is learned per account from its traffic.
      # Until then: capacity (relative, Pro = 1) × median learned $ per unit,
      # or default_unit_usd before any account has learned.
      capacity:
        me@work.example: 1
      default_unit_usd: 220
      learn_min_delta: 0.05     # share of a week seen before an estimate is used
      # capacity_usd:           # pin instead of learning
      #   me@work.example: 1200

      # Clients: one or more API keys, an ordered list of buckets and what to do
      # when none of their buckets (and no spare elsewhere) can serve them.
      # Keys are caller scopes (scripts/client-scope.sh) or sha256(key).
      clients:
        laptop:
          keys: ["<64-hex caller scope>"]
          buckets: [work, side]
          on_exhausted: any     # any | wait | fail
        ci:
          keys: ["<64-hex caller scope>"]
          buckets: [personal]
          on_exhausted: wait
          borrow: true          # may use other buckets' spare (default true)

      # Keys not listed above.
      default_client:
        buckets: []
        on_exhausted: any

      # Slow a client down when its last account would run out before a
      # refill that is within `horizon`; at most `max_delay` per request.
      pacing:
        enabled: true
        horizon: 2h
        max_delay: 30s

      # on_exhausted: wait — hold each request up to max_wait when the refill
      # is within horizon, then answer 429 with Retry-After.
      wait:
        horizon: 2h
        max_wait: 30s
